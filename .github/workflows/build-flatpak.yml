name: Build Flatpak

on:
  push:
    branches:
      - main
    paths:
      - io.github.deterous.redumper-gui.yml
      - io.github.deterous.redumper-gui.metainfo.xml
      - io.github.deterous.redumper-gui.desktop
      - cargo-sources.json
  pull_request:
    paths:
      - io.github.deterous.redumper-gui.yml
      - io.github.deterous.redumper-gui.metainfo.xml
      - io.github.deterous.redumper-gui.desktop
      - cargo-sources.json
  workflow_dispatch:

permissions:
  contents: read

env:
  MANIFEST: io.github.deterous.redumper-gui.yml
  METAINFO: io.github.deterous.redumper-gui.metainfo.xml
  APP_ID: io.github.deterous.redumper-gui
  BUNDLE: io.github.deterous.redumper-gui.flatpak

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    container:
      image: bilelmoussaoui/flatpak-github-actions:freedesktop-24.08@sha256:d534700a8a0090dfa5e23ed3ae09106a1beafde54e66b6b1327b27dbd3f0c7c2
      options: --privileged

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build and bundle Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3
        with:
          bundle: ${{ env.BUNDLE }}
          manifest-path: ${{ env.MANIFEST }}
          cache: true
          upload-artifact: false

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_ID }}
          path: ${{ env.BUNDLE }}

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download Flatpak artifact
        uses: actions/download-artifact@87c55149d96e628cc2ef7e6fc2aab372015aec85
        with:
          name: ${{ env.APP_ID }}

      - name: Determine release version
        id: version
        run: |
          set -euo pipefail

          VERSION="$(
            grep -oE '<release version="[^"]+"' "${METAINFO}" |
              head -1 |
              sed -E 's/<release version="([^"]+)"/\1/'
          )"

          if [[ -z "${VERSION}" ]]; then
            echo "Could not determine release version from ${METAINFO}" >&2
            exit 1
          fi

          echo "Release version: v${VERSION}"
          echo "tag=v${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Check for existing release
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists."
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish release
        if: steps.existing.outputs.exists == 'false'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: ${{ env.BUNDLE }}
