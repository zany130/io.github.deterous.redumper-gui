name: Build Flatpak

on:
  push:
    branches:
      - main
    paths:
      - io.github.deterous.redumper-gui.yml
      - io.github.deterous.redumper-gui.metainfo.xml
      - io.github.deterous.redumper-gui.desktop
      - cargo-sources.json
  pull_request:
    paths:
      - io.github.deterous.redumper-gui.yml
      - io.github.deterous.redumper-gui.metainfo.xml
      - io.github.deterous.redumper-gui.desktop
      - cargo-sources.json
  workflow_dispatch:

permissions:
  contents: write

env:
  MANIFEST: io.github.deterous.redumper-gui.yml
  METAINFO: io.github.deterous.redumper-gui.metainfo.xml
  APP_ID: io.github.deterous.redumper-gui
  BUNDLE: io.github.deterous.redumper-gui.flatpak

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    container:
      image: bilelmoussaoui/flatpak-github-actions:freedesktop-24.08
      options: --privileged

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and bundle Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: ${{ env.BUNDLE }}
          manifest-path: ${{ env.MANIFEST }}
          cache: true

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_ID }}
          path: ${{ env.BUNDLE }}

      - name: Determine release version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: version
        run: |
          set -euo pipefail

          VERSION="$(
            grep -oE '<release version="[^"]+"' "${METAINFO}" |
              head -1 |
              sed -E 's/<release version="([^"]+)"/\1/'
          )"

          if [[ -z "${VERSION}" ]]; then
            echo "Could not determine release version from ${METAINFO}" >&2
            exit 1
          fi

          echo "Release version: v${VERSION}"
          echo "tag=v${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Check for existing release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists."
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish release
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          steps.existing.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: ${{ env.BUNDLE }}
